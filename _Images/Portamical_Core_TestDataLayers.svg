	#.found: fill=#ffcccc title=center,bold
	#.core: fill=#ffffcc title=center,bold 
	#.marker: fill=#ccffff title=center,bold 
	#.spec: fill=#ccffcc title=center,bold 
	
	
	[&lt;found&gt;1. Identity Layer
	||
	INamedCase ← Semantic identification &amp; deduplication
	 |
	 Purpose: Equality, deduplication, test case naming
	 ]
	 
	[&lt;core&gt;2. Core Abstraction Layer
	||
	ITestData ← Non-generic contract for framework adapters
	 |
	 Purpose: Reflection-based, dynamically typed handling]
	 
	[&lt;marker&gt;3. Pattern Markers Layer
	||
	IExpected&lt;T&gt; ← Expected outcome categorization
	 |
	 Purpose: Semantic specialization
	 - IReturns&lt;TStruct&gt; → Return-value assertions
	 - IThrows&lt;TException&gt; → Exception assertions]
	 
	[&lt;spec&gt;4. Specialization Layer
	||
	Concrete DTOs ← Fully typed implementations
	with compile-time type safety
	 |
	 - TestData&lt;T1..T9&gt; (general test data)
	 - TestDataReturns&lt;TStruct, T1..T9&gt; (return-value tests)
	 - TestDataThrows&lt;TException, T1..T9&gt; (exception tests)
	]
	
	[
	1. Identity Layer
	] -&gt; [
	2. Core Abstraction Layer
	] -&gt; [
	4. Specialization Layer
	] 
	
	[
	3. Pattern Markers Layer
	] -&gt; [
	4. Specialization Layer
	]
	</desc>
