	<desc >#title: Portamical_Core_Formatting_FormatterSelection
	#direction: down
	
	// #.start: fill=#ffcc99 title=center,bold, body=left visual=input
	#.start: title=center,bold, body=left
	#.step: title=center,italic body=left,italic
	#.custom: fill=#DCE8CF title=center bold body=left
	#.default: fill=#C9DEEF title=center,bold body=left
	
	[&lt;start&gt;
	Formatter.Format(value)
	|
	
	// Elements
	
	[Null-check]
	
	[Check
	Formatter.Registry
	for Type of value]
	
	[&lt;choice&gt;value
	is null?]
	
	[&lt;choice&gt;Custom
	formatter
	found?]
	
	[&lt;default&gt;Use DefaultFormatter]
	
	[&lt;custom&gt;Use custom formatter]
	
	[Return
	formatted string]
	
	// Diagram
	
	[
	Null-check
	] -&gt; [
	value
	]
	
	[
	value
	] yes -&gt; [
	Return null
	]
	
	[
	Check
	] -&gt; [
	Custom
	]
	
	[
	value
	] no -&gt; [
	Check
	]
	
	[
	Custom
	] no -&gt; [
	Use DefaultFormatter
	]
	
	[
	Use DefaultFormatter
	] -&gt; [
	Return
	]
	
	[
	Custom
	] yes -&gt; [
	Use custom formatter
	]
	
	[
	Use custom formatter
	] -&gt; [
	Return
	]
	
	]
	
	
	
	</desc>
