	Use custom formatter
	]
	
	[
	Custom
	] no -&gt; [&lt;default&gt;
	Use DefaultFormatter
	]
	
	[
	Use custom formatter
	] -&gt; [
	Return
	formatted string
	(or null)
	]
	
	[
	Use DefaultFormatter
	] -&gt; [
	Return
	]
	
	]
	
	
	
	
