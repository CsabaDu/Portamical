	#.default: fill=#C9DEEF title=center,bold body=left
	
	[&lt;start&gt;
	Formatter.GetFormatter(type?)
	|
	
	// Elements
	
	[Null-check]
	
	[Check
	Formatter.Registry
	for type]
	
	[&lt;choice&gt;type
	is null?]
	
	[&lt;choice&gt;Custom
	formatter
	found?]
	
	[&lt;default&gt;Return DefaultFormatter]
	
	[&lt;custom&gt;Return custom formatter]
	
	
	// Diagram
	
	[
	Null-check
	] -&gt; [
	type
	]
	
	
	
	[
	type
	] yes -&gt; [
	Return DefaultFormatter
	]
	
	
	[
	Custom
	] no -&gt; [
	Return DefaultFormatter
	]
	[
	type
	] no -&gt; [
	Check
	]
	[
	Custom
	] yes -&gt; [
	Return custom formatter
	]
	
	[
	Check
	] -&gt; [
	Custom
	]
	
	]
	
	
	
	</desc>
