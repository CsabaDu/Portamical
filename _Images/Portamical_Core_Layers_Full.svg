	<desc >#title: Portamical_Core_Layers_Full
	#direction: down
	
	#.layer: fill=#adebeb title=bold
	#.utility: fill=#70dbdb title=bold,underline
	
	#.found: fill=#ffe6e6 title=center,bold,italic body=italic
	#.core: fill=#ffcccc title=center,bold,italic body=italic 
	#.marker: fill=#80e5ff title=center,bold,italic body=italic 
	#.spec: fill=#e6ccff title=center,bold 
	
	
	
	[&lt;found&gt;Identity Layer
	|
	 Equality, deduplication, test‑case naming
	// ||
	// Types:
	// - INamedCase (contract)
	// -- NamedCase (abstract)
	]
	
	[&lt;core&gt;Core Abstraction Layer
	|
	 Reflection‑based, runtime‑inspected handling
	// ||
	// Types:
	// - ITestData (contract)
	// -- TestDataBase (abstract)
	]
	
	[&lt;marker&gt;Pattern Markers Layer
	|
	 Semantic specialization markers
	// ||
	// Types (contracts):
	// - IExpected
	// -- IExpected&lt;T&gt; (expected‑outcome categories)
	// - IReturns
	// -- IReturns&lt;TStruct&gt; (return‑value assertions)
	// - IThrows
	// -- IThrows&lt;TException&gt; (exception assertions)
	]
	
	[&lt;spec&gt;Specialization Layer
	|
	 Immutable, strongly typed DTOs
	// ||
	// Types:
	// - TestData&lt;T1..T9&gt; (general test data)
	// 
	// - TestDataExpected&lt;T&gt; (abstract)
	// -- TestDataReturns&lt;TStruct&gt; (abstract)
	// --- TestDataReturns&lt;TStruct, T1..T9&gt; (return‑value tests)
	// 
	// -- TestDataThrows&lt;TException&gt; (abstract)
	// --- TestDataThrows&lt;TException, T1..T9&gt; (exception tests)
	]
	
	 
	[&lt;utility&gt;Strategy Layer
	|
	Data materialization controlling enums]
	
	[&lt;utility&gt;Safety Layer
	|
	Validators and resolvers]
	[&lt;utility&gt;Factory Layer
	|
	Fluent test data factories]
	
	  
	  [
	  Strategy Layer
	  ] &lt;:-- [
	  Core Abstraction Layer
	  ]
	
	  [
	  Safety Layer
	  ] &lt;:-- [
	  Identity Layer
	  ]
	
	  
	
	  [
	  Identity Layer
	  ] &lt;:-- [
	  Core Abstraction Layer
	  ]
	
	
	  [
	  Core Abstraction Layer
	  ] &lt;:-- [
	  Specialization Layer
	  ]
	
	  [
	  Specialization Layer
	  ] &lt;:-- [
	  Factory Layer
	  ]
	
	  [
	  Pattern Markers Layer
	  ] &lt;:-- [
	  Specialization Layer
	  ]
	
	</desc>
